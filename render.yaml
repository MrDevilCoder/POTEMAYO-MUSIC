services:
  - type: worker
    name: potemayomusic
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Set these environment variables in the Render dashboard
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
    autoDeploy: true
    
